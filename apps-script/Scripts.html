<script>
(function () {
  'use strict';

  var STORAGE_TOKEN_KEY = 'sj_guest_session_token';
  var MAX_FILE_BYTES = 10 * 1024 * 1024; // 10 MB initial limit
  var ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  var PAGE_SIZE = 24;
  var THUMB_BATCH_SIZE = 5;
  var MAX_CONCURRENT_THUMB_CALLS = 2;

  var state = {
    token: sessionStorage.getItem(STORAGE_TOKEN_KEY) || '',
    guest: null,
    activeTab: 'all',    // 'all' | 'my'
    photos: [],          // Ordered metadata list for active masonry view
    photoMap: {},        // photo_id -> { meta, thumbUrl, mediumUrl, cardEl, imgEl, boxEl }
    page: 0,
    hasMore: false,
    totalCount: 0,
    isLoadingPage: false,
    columnCount: 2,
    lightboxIndex: -1,
    lightboxList: [],    // Active list displayed in lightbox (masonry photos or suggestion preview)
    thumbQueue: [],
    activeThumbCalls: 0,
    uploadQueue: [],     // [{ id, file, previewUrl, status, progress, error }]
    isUploading: false,
    isDownloadingOriginal: false,
    // Face recognition ("My Photos") state
    faceProfile: null,
    faceCounts: { confirmedCount: 0, pendingCount: 0 },
    suggestions: [],
    suggestionMap: {},   // photo_id -> { meta, cardEl, imgEl, mediaEl, thumbUrl, mediumUrl }
    suggestionsPage: 0,
    suggestionsHasMore: false,
    isLoadingSuggestions: false,
    faceRefFiles: [],    // [{ id, file, previewUrl }]
    isSubmittingFace: false
  };

  // DOM References
  var loginView = document.getElementById('login-view');
  var galleryView = document.getElementById('gallery-view');
  var loginForm = document.getElementById('guest-login-form');
  var loginUserInput = document.getElementById('login-username');
  var loginMobileInput = document.getElementById('login-mobile');
  var togglePwBtn = document.getElementById('btn-toggle-pw');
  var loginSubmitBtn = document.getElementById('btn-login-submit');
  var loginErrorEl = document.getElementById('login-error');

  var welcomeLabel = document.getElementById('guest-welcome-label');
  var countLabel = document.getElementById('gallery-count-label');
  var skeletonEl = document.getElementById('gallery-skeleton');
  var emptyEl = document.getElementById('gallery-empty');
  var myEmptyEl = document.getElementById('my-photos-empty');
  var myEmptyDesc = document.getElementById('my-photos-empty-desc');
  var myEmptyFaceBtn = document.getElementById('btn-my-empty-face');
  var masonryEl = document.getElementById('masonry-grid');
  var loadMoreWrap = document.getElementById('load-more-wrap');
  var loadMoreBtn = document.getElementById('btn-load-more');
  var openUploadBtn = document.getElementById('btn-open-upload');
  var emptyUploadBtn = document.getElementById('btn-empty-upload');
  var logoutBtn = document.getElementById('btn-logout');
  var refreshBtn = document.getElementById('btn-refresh-gallery');

  // Face / My Photos DOM References
  var tabAllBtn = document.getElementById('tab-all-photos');
  var tabMyBtn = document.getElementById('tab-my-photos');
  var pendingBadgeEl = document.getElementById('my-photos-pending-badge');
  var topbarFaceBtn = document.getElementById('btn-topbar-face');
  var myPhotosPanel = document.getElementById('my-photos-panel');
  var faceStatusPill = document.getElementById('face-status-pill');
  var faceBannerDesc = document.getElementById('face-banner-desc');
  var openFaceModalBtn = document.getElementById('btn-open-face-modal');
  var withdrawFaceBtn = document.getElementById('btn-withdraw-face');
  var suggestionsPanel = document.getElementById('suggestions-panel');
  var suggestionsHeading = document.getElementById('suggestions-heading');
  var suggestionsGrid = document.getElementById('suggestions-grid');
  var suggestionsMoreWrap = document.getElementById('suggestions-more-wrap');
  var loadMoreSuggestionsBtn = document.getElementById('btn-load-more-suggestions');

  var faceModal = document.getElementById('face-modal');
  var closeFaceModalBtn = document.getElementById('btn-close-face-modal');
  var cancelFaceModalBtn = document.getElementById('btn-cancel-face-modal');
  var faceDropzone = document.getElementById('face-dropzone');
  var faceFilePicker = document.getElementById('face-file-picker');
  var facePreviewStrip = document.getElementById('face-preview-strip');
  var faceConsentCheckbox = document.getElementById('face-consent-checkbox');
  var faceModalMsg = document.getElementById('face-modal-msg');
  var submitFaceBtn = document.getElementById('btn-submit-face');

  var uploadModal = document.getElementById('upload-modal');
  var closeUploadBtn = document.getElementById('btn-close-upload');
  var dropzone = document.getElementById('upload-dropzone');
  var filePicker = document.getElementById('file-picker-input');
  var queueListEl = document.getElementById('upload-queue-list');
  var startUploadBtn = document.getElementById('btn-start-upload');
  var retryFailedBtn = document.getElementById('btn-retry-failed');

  var lightboxEl = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var lightboxAuthor = document.getElementById('lightbox-author');
  var lightboxDate = document.getElementById('lightbox-date');
  var lightboxCounter = document.getElementById('lightbox-counter');
  var lightboxStage = document.getElementById('lightbox-stage');
  var lightboxDownloadBtn = document.getElementById('btn-lb-download');
  var lightboxDownloadLabel = document.getElementById('btn-lb-download-label');
  var toastEl = document.getElementById('toast');

  var toastTimer = null;
  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.add('hidden');
    }, 3600);
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    } catch (e) {
      return '';
    }
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 KB';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function computeColumnCount() {
    var w = window.innerWidth;
    if (w >= 1024) return 4;
    if (w >= 680) return 3;
    return 2;
  }

  /* =====================================================================
     1. AUTHENTICATION FLOW
     ===================================================================== */
  togglePwBtn.addEventListener('click', function () {
    var isPw = loginMobileInput.type === 'password';
    loginMobileInput.type = isPw ? 'text' : 'password';
    togglePwBtn.textContent = isPw ? 'Hide' : 'Show';
  });

  function enterGallery(guest) {
    state.guest = guest;
    state.activeTab = 'all';
    loginView.classList.add('hidden');
    galleryView.classList.remove('hidden');
    welcomeLabel.textContent = 'Signed in as ' + guest.name;
    if (!guest.canUpload) {
      openUploadBtn.classList.add('hidden');
      emptyUploadBtn.classList.add('hidden');
    } else {
      openUploadBtn.classList.remove('hidden');
      emptyUploadBtn.classList.remove('hidden');
    }
    updateTabButtonsUI();
    resetAndLoadGallery();
    loadFaceProfileStatus();
  }

  var galleryGen = 0;
  var uploadSessionGen = 0;
  var downloadSessionGen = 0;

  function setDownloadButtonBusy(busy) {
    state.isDownloadingOriginal = busy;
    if (lightboxDownloadBtn) lightboxDownloadBtn.disabled = busy;
    if (lightboxDownloadLabel) {
      lightboxDownloadLabel.textContent = busy ? 'Downloading...' : 'Download Original';
    }
  }

  function dataUrlToBlob(dataUrl, fallbackMime) {
    var parts = String(dataUrl || '').split(',');
    var mimeMatch = parts[0] && parts[0].match(/data:([^;]+);base64/i);
    var mime = (mimeMatch && mimeMatch[1]) || fallbackMime || 'application/octet-stream';
    var bin = atob(parts[1] || '');
    var len = bin.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return new Blob([bytes], { type: mime });
  }

  function clearUploadQueue() {
    (state.uploadQueue || []).forEach(function (q) {
      if (q && q.previewUrl) {
        try { URL.revokeObjectURL(q.previewUrl); } catch (e) {}
      }
    });
    state.uploadQueue = [];
    state.isUploading = false;
    if (typeof renderUploadQueue === 'function') {
      renderUploadQueue();
    }
  }

  function returnToLogin(message) {
    galleryGen++;
    uploadSessionGen++;
    downloadSessionGen++;
    setDownloadButtonBusy(false);
    state.isLoadingPage = false;
    state.token = '';
    state.guest = null;
    state.activeTab = 'all';
    state.photos = [];
    state.photoMap = {};
    state.thumbQueue = [];
    state.lightboxIndex = -1;
    state.lightboxList = [];
    state.faceProfile = null;
    state.faceCounts = { confirmedCount: 0, pendingCount: 0 };
    state.suggestions = [];
    state.suggestionMap = {};
    state.suggestionsPage = 0;
    state.suggestionsHasMore = false;
    state.isLoadingSuggestions = false;
    clearFaceRefFiles();
    retriedBatchIds = {};
    clearUploadQueue();
    sessionStorage.removeItem(STORAGE_TOKEN_KEY);
    // Wipe private image data URLs from DOM immediately on logout
    masonryEl.innerHTML = '';
    suggestionsGrid.innerHTML = '';
    lightboxImg.src = '';
    document.body.style.overflow = '';
    galleryView.classList.add('hidden');
    uploadModal.classList.add('hidden');
    faceModal.classList.add('hidden');
    lightboxEl.classList.add('hidden');
    loginView.classList.remove('hidden');
    if (message) {
      loginErrorEl.textContent = message;
      loginErrorEl.className = 'alert-msg error';
    }
  }

  function handleServerAuthError(errMsg) {
    if (errMsg && (errMsg.indexOf('UNAUTHORIZED') !== -1 || errMsg.indexOf('expired') !== -1)) {
      returnToLogin('Your session has expired. Please sign in again.');
      return true;
    }
    return false;
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginErrorEl.textContent = '';
    var username = (loginUserInput.value || '').trim();
    var mobile = (loginMobileInput.value || '').trim();
    if (!username || !mobile) {
      loginErrorEl.textContent = 'Please enter both username and registered mobile number.';
      loginErrorEl.className = 'alert-msg error';
      return;
    }

    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = 'Signing in...';

    google.script.run
      .withSuccessHandler(function (res) {
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.textContent = 'Enter Memories Gallery';
        if (!res || !res.ok) {
          loginErrorEl.textContent = (res && res.error) || 'Invalid username or mobile number.';
          loginErrorEl.className = 'alert-msg error';
          return;
        }
        state.token = res.token;
        sessionStorage.setItem(STORAGE_TOKEN_KEY, res.token);
        loginMobileInput.value = '';
        enterGallery(res.guest);
      })
      .withFailureHandler(function () {
        loginSubmitBtn.disabled = false;
        loginSubmitBtn.textContent = 'Enter Memories Gallery';
        loginErrorEl.textContent = 'Unable to connect right now. Please try again.';
        loginErrorEl.className = 'alert-msg error';
      })
      .guestLogin(username, mobile);
  });

  logoutBtn.addEventListener('click', function () {
    var tok = state.token;
    returnToLogin('');
    showToast('You have been signed out.');
    if (tok) {
      google.script.run.guestLogout(tok);
    }
  });

  // Restore active session on page reload
  if (state.token) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok && res.guest) {
          enterGallery(res.guest);
        } else {
          returnToLogin('');
        }
      })
      .withFailureHandler(function () {
        returnToLogin('');
      })
      .checkGuestSession(state.token);
  }

  /* =====================================================================
     2. BALANCED MASONRY GALLERY & BATCHED PRIVATE THUMBNAIL LOADER
     ===================================================================== */
  function buildMasonryColumns() {
    state.columnCount = computeColumnCount();
    masonryEl.innerHTML = '';
    for (var i = 0; i < state.columnCount; i++) {
      var col = document.createElement('div');
      col.className = 'masonry-column';
      col.dataset.estHeight = '0';
      masonryEl.appendChild(col);
    }
  }

  function getShortestColumn() {
    var cols = masonryEl.children;
    var best = cols[0];
    var bestH = parseFloat(best.dataset.estHeight || '0');
    for (var i = 1; i < cols.length; i++) {
      var h = parseFloat(cols[i].dataset.estHeight || '0');
      if (h < bestH) {
        bestH = h;
        best = cols[i];
      }
    }
    return best;
  }

  function createPhotoCard(meta) {
    var card = document.createElement('article');
    card.className = 'photo-card';
    card.setAttribute('tabindex', '0');

    var box = document.createElement('div');
    box.className = 'photo-media-box';
    var ratio = (meta.width > 0 && meta.height > 0) ? (meta.height / meta.width) : 1.15;
    box.style.aspectRatio = (meta.width > 0 && meta.height > 0) ? (meta.width + ' / ' + meta.height) : '4 / 5';

    var img = document.createElement('img');
    img.alt = 'Shared by ' + meta.guest_name;
    img.loading = 'lazy';
    box.appendChild(img);

    var caption = document.createElement('div');
    caption.className = 'photo-caption';

    var author = document.createElement('div');
    author.className = 'photo-author';
    author.textContent = meta.guest_name;

    var dateEl = document.createElement('div');
    dateEl.className = 'photo-date';
    dateEl.textContent = formatDate(meta.upload_timestamp);

    caption.appendChild(author);
    caption.appendChild(dateEl);
    card.appendChild(box);
    card.appendChild(caption);

    card.addEventListener('click', function () {
      openLightboxByPhotoId(meta.photo_id);
    });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightboxByPhotoId(meta.photo_id);
      }
    });

    return { card: card, box: box, img: img, ratio: ratio };
  }

  function appendPhotoToMasonry(meta, preloadedThumb) {
    if (state.photoMap[meta.photo_id]) return;

    var ui = createPhotoCard(meta);
    var entry = {
      meta: meta,
      thumbUrl: preloadedThumb || null,
      mediumUrl: null,
      cardEl: ui.card,
      imgEl: ui.img,
      boxEl: ui.box
    };
    state.photoMap[meta.photo_id] = entry;
    state.photos.push(meta);

    var col = getShortestColumn();
    col.appendChild(ui.card);
    col.dataset.estHeight = String(parseFloat(col.dataset.estHeight || '0') + ui.ratio + 0.25);

    if (preloadedThumb) {
      applyThumbToEntry(entry, preloadedThumb);
    } else {
      state.thumbQueue.push(meta.photo_id);
    }
  }

  function applyThumbToEntry(entry, dataUrl) {
    entry.thumbUrl = dataUrl;
    entry.imgEl.src = dataUrl;
    entry.boxEl.style.aspectRatio = '';
    entry.boxEl.classList.add('loaded');
  }

  var retriedBatchIds = {};
  function pumpThumbnailQueue() {
    while (state.activeThumbCalls < MAX_CONCURRENT_THUMB_CALLS && state.thumbQueue.length > 0) {
      var batch = state.thumbQueue.splice(0, THUMB_BATCH_SIZE);
      var reqGen = galleryGen;
      state.activeThumbCalls++;

      (function (ids, gen) {
        google.script.run
          .withSuccessHandler(function (res) {
            state.activeThumbCalls--;
            if (gen !== galleryGen) {
              pumpThumbnailQueue();
              return;
            }
            if (res && res.ok && res.items) {
              Object.keys(res.items).forEach(function (pid) {
                var dataUrl = res.items[pid];
                if (!dataUrl) return;
                var entry = state.photoMap[pid];
                if (entry) {
                  applyThumbToEntry(entry, dataUrl);
                }
                var sugEntry = state.suggestionMap[pid];
                if (sugEntry) {
                  sugEntry.thumbUrl = dataUrl;
                  sugEntry.imgEl.src = dataUrl;
                  sugEntry.mediaEl.classList.add('loaded');
                }
              });
            } else if (res && res.error) {
              handleServerAuthError(res.error);
            }
            pumpThumbnailQueue();
          })
          .withFailureHandler(function () {
            state.activeThumbCalls--;
            if (gen !== galleryGen) {
              pumpThumbnailQueue();
              return;
            }
            // Retry each failed thumbnail once after a brief backoff
            var toRetry = ids.filter(function (id) {
              if (retriedBatchIds[id]) return false;
              retriedBatchIds[id] = true;
              return true;
            });
            if (toRetry.length > 0) {
              setTimeout(function () {
                if (gen !== galleryGen) return;
                Array.prototype.push.apply(state.thumbQueue, toRetry);
                pumpThumbnailQueue();
              }, 1200);
            } else {
              pumpThumbnailQueue();
            }
          })
          .getPrivatePhotoBatch(ids, state.token);
      })(batch, reqGen);
    }
  }

  function resetAndLoadGallery() {
    galleryGen++;
    state.isLoadingPage = false;
    state.photos = [];
    state.photoMap = {};
    state.thumbQueue = [];
    retriedBatchIds = {};
    state.page = 0;
    state.hasMore = false;
    buildMasonryColumns();
    masonryEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    myEmptyEl.classList.add('hidden');
    loadMoreWrap.classList.add('hidden');
    skeletonEl.classList.remove('hidden');

    if (state.activeTab === 'my') {
      myPhotosPanel.classList.remove('hidden');
      loadFaceProfileStatus();
      resetAndLoadSuggestions();
    } else {
      myPhotosPanel.classList.add('hidden');
    }

    loadNextPage();
  }

  function loadNextPage() {
    if (state.isLoadingPage) return;
    state.isLoadingPage = true;
    var gen = galleryGen;
    var isMyTab = state.activeTab === 'my';
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Loading...';

    var targetPage = state.page + 1;
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        if (gen !== galleryGen) return;
        state.isLoadingPage = false;
        skeletonEl.classList.add('hidden');
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More Photographs';

        if (!res || !res.ok) {
          if (!handleServerAuthError(res && res.error)) {
            showToast((res && res.error) || 'Failed to load gallery.', true);
          }
          return;
        }

        state.page = res.page;
        state.totalCount = res.totalCount;
        state.hasMore = res.hasMore;
        if (isMyTab) {
          countLabel.textContent = res.totalCount + (res.totalCount === 1 ? ' Confirmed Photograph of You' : ' Confirmed Photographs of You');
        } else {
          countLabel.textContent = res.totalCount + (res.totalCount === 1 ? ' Photograph' : ' Photographs');
        }

        if (res.totalCount === 0) {
          masonryEl.classList.add('hidden');
          loadMoreWrap.classList.add('hidden');
          if (isMyTab) {
            emptyEl.classList.add('hidden');
            myEmptyEl.classList.remove('hidden');
          } else {
            myEmptyEl.classList.add('hidden');
            emptyEl.classList.remove('hidden');
          }
          return;
        }

        emptyEl.classList.add('hidden');
        myEmptyEl.classList.add('hidden');
        masonryEl.classList.remove('hidden');
        (res.photos || []).forEach(function (meta) {
          appendPhotoToMasonry(meta, null);
        });
        pumpThumbnailQueue();

        if (state.hasMore) {
          loadMoreWrap.classList.remove('hidden');
        } else {
          loadMoreWrap.classList.add('hidden');
        }
      })
      .withFailureHandler(function () {
        if (gen !== galleryGen) return;
        state.isLoadingPage = false;
        skeletonEl.classList.add('hidden');
        loadMoreBtn.disabled = false;
        loadMoreBtn.textContent = 'Load More Photographs';
        showToast('Network error loading gallery. Please refresh.', true);
      });

    if (isMyTab) {
      runner.listMyPhotos(state.token, targetPage, PAGE_SIZE);
    } else {
      runner.listGalleryPhotos(state.token, targetPage, PAGE_SIZE);
    }
  }

  loadMoreBtn.addEventListener('click', loadNextPage);
  refreshBtn.addEventListener('click', resetAndLoadGallery);

  // Automatic infinite-scroll pagination alongside the Load More button
  if (typeof IntersectionObserver !== 'undefined') {
    var scrollObserver = new IntersectionObserver(function (entries) {
      if (entries[0] && entries[0].isIntersecting && state.hasMore && !state.isLoadingPage && state.token) {
        loadNextPage();
      }
    }, { rootMargin: '220px' });
    scrollObserver.observe(loadMoreWrap);
  }

  // Re-layout masonry columns smoothly on orientation/resize change
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var nextCols = computeColumnCount();
      if (nextCols !== state.columnCount && state.photos.length > 0) {
        var existingMetas = state.photos.slice();
        var savedThumbs = {};
        existingMetas.forEach(function (m) {
          if (state.photoMap[m.photo_id]) {
            savedThumbs[m.photo_id] = state.photoMap[m.photo_id].thumbUrl;
          }
        });
        state.photos = [];
        state.photoMap = {};
        buildMasonryColumns();
        existingMetas.forEach(function (m) {
          appendPhotoToMasonry(m, savedThumbs[m.photo_id]);
        });
        pumpThumbnailQueue();
      }
    }, 220);
  });

  /* =====================================================================
     3. FULL-SCREEN LIGHTBOX (Medium WebP Variant, Swipe & Keyboard Nav)
     ===================================================================== */
  function openLightboxForList(list, photoId) {
    var items = list || [];
    var idx = items.findIndex(function (p) { return p.photo_id === photoId; });
    if (idx === -1) return;
    state.lightboxList = items;
    state.lightboxIndex = idx;
    lightboxEl.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    renderLightboxCurrent();
  }

  function openLightboxByPhotoId(photoId) {
    openLightboxForList(state.photos, photoId);
  }

  function closeLightbox() {
    lightboxEl.classList.add('hidden');
    document.body.style.overflow = '';
    state.lightboxIndex = -1;
    state.lightboxList = [];
  }

  function stepLightbox(delta) {
    var list = state.lightboxList || [];
    if (list.length === 0) return;
    state.lightboxIndex = (state.lightboxIndex + delta + list.length) % list.length;
    renderLightboxCurrent();
  }

  function renderLightboxCurrent() {
    var list = state.lightboxList || [];
    var meta = list[state.lightboxIndex];
    if (!meta) return;
    var entry = state.photoMap[meta.photo_id] || state.suggestionMap[meta.photo_id];

    lightboxCounter.textContent = (state.lightboxIndex + 1) + ' / ' + list.length;
    lightboxAuthor.textContent = 'Shared by ' + meta.guest_name;
    lightboxDate.textContent = formatDate(meta.upload_timestamp);

    // Show medium immediately if cached in memory, else show thumbnail while fetching medium
    if (entry && entry.mediumUrl) {
      lightboxImg.src = entry.mediumUrl;
      return;
    }
    if (entry && entry.thumbUrl) {
      lightboxImg.src = entry.thumbUrl;
    } else {
      lightboxImg.src = '';
    }

    var activeId = meta.photo_id;
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok && res.dataUrl) {
          if (state.photoMap[activeId]) {
            state.photoMap[activeId].mediumUrl = res.dataUrl;
          }
          if (state.suggestionMap[activeId]) {
            state.suggestionMap[activeId].mediumUrl = res.dataUrl;
          }
          var curList = state.lightboxList || [];
          var cur = curList[state.lightboxIndex];
          if (cur && cur.photo_id === activeId) {
            lightboxImg.src = res.dataUrl;
          }
        } else if (res && res.error) {
          if (!handleServerAuthError(res.error)) {
            showToast('Could not load higher-resolution preview.', true);
          }
        }
      })
      .withFailureHandler(function () {
        showToast('Network error loading photograph. Showing preview.', true);
      })
      .getPrivatePhoto(activeId, state.token, 'medium');
  }

  document.getElementById('btn-close-lightbox').addEventListener('click', closeLightbox);
  document.getElementById('btn-lb-prev').addEventListener('click', function () { stepLightbox(-1); });
  document.getElementById('btn-lb-next').addEventListener('click', function () { stepLightbox(1); });

  if (lightboxDownloadBtn) {
    lightboxDownloadBtn.addEventListener('click', function () {
      if (state.isDownloadingOriginal || !state.token) return;
      var curList = state.lightboxList || [];
      var meta = curList[state.lightboxIndex];
      if (!meta || !meta.photo_id) return;

      var dlGen = downloadSessionGen;
      setDownloadButtonBusy(true);
      showToast('Preparing original photograph...');

      google.script.run
        .withSuccessHandler(function (res) {
          if (dlGen !== downloadSessionGen) return;
          setDownloadButtonBusy(false);
          if (!res || !res.ok || !res.dataUrl) {
            if (!handleServerAuthError(res && res.error)) {
              showToast((res && res.error) || 'Could not download original photograph.', true);
            }
            return;
          }
          try {
            var blob = dataUrlToBlob(res.dataUrl, res.mimeType);
            var blobUrl = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = blobUrl;
            a.download = res.filename || (meta.photo_id + '.jpg');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 5000);
            showToast('Original photograph downloaded.');
          } catch (err) {
            showToast('Download could not start on this browser.', true);
          }
        })
        .withFailureHandler(function () {
          if (dlGen !== downloadSessionGen) return;
          setDownloadButtonBusy(false);
          showToast('Network error downloading original. Please try again.', true);
        })
        .downloadGuestOriginal(meta.photo_id, state.token);
    });
  }

  /**
   * Generates Canvas WebP thumbnail (500px) and medium (1400px) derivatives in the browser.
   * Re-encoding via Canvas automatically strips EXIF GPS data from derivatives while preserving
   * the original file untouched.
   */
  function generateDerivatives(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var objUrl = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(objUrl);
        var natW = img.naturalWidth;
        var natH = img.naturalHeight;

        function renderMax(maxDim, quality) {
          var scale = Math.min(1, maxDim / Math.max(natW, natH));
          var w = Math.max(1, Math.round(natW * scale));
          var h = Math.max(1, Math.round(natH * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          var webp = canvas.toDataURL('image/webp', quality);
          if (webp.indexOf('data:image/webp') === 0) {
            return webp;
          }
          // Fallback for legacy browsers without Canvas WebP support
          return canvas.toDataURL('image/jpeg', quality);
        }

        try {
          resolve({
            width: natW,
            height: natH,
            thumbBase64: renderMax(500, 0.80),
            mediumBase64: renderMax(1400, 0.85)
          });
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(objUrl);
        reject(new Error('Could not decode image file.'));
      };
      img.src = objUrl;
    });
  }

  function readFileAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error('Failed to read file.')); };
      reader.readAsDataURL(file);
    });
  }

  /**
   * Sends original via Apps Script native HTML <form> Blob transport (avoiding Base64 bloat),
   * falling back to Base64 transport if DataTransfer is unavailable.
   */
  function sendSinglePhoto(item, derivatives, sessionToken) {
    return new Promise(function (resolve, reject) {
      var useFormBlob = false;
      try {
        if (!window.__GAS_FETCH_BRIDGE__ && typeof DataTransfer !== 'undefined') {
          var dt = new DataTransfer();
          dt.items.add(item.file);
          var fileInput = document.getElementById('hidden-original-file');
          fileInput.files = dt.files;
          useFormBlob = fileInput.files && fileInput.files.length === 1;
        }
      } catch (e) {
        useFormBlob = false;
      }

      function clearHiddenForm() {
        var fi = document.getElementById('hidden-original-file');
        if (fi) fi.value = '';
        document.getElementById('hidden-thumb-b64').value = '';
        document.getElementById('hidden-medium-b64').value = '';
        document.getElementById('hidden-session-token').value = '';
      }

      if (useFormBlob) {
        document.getElementById('hidden-session-token').value = sessionToken;
        document.getElementById('hidden-original-name').value = item.file.name;
        document.getElementById('hidden-thumb-b64').value = derivatives.thumbBase64;
        document.getElementById('hidden-medium-b64').value = derivatives.mediumBase64;
        document.getElementById('hidden-width').value = String(derivatives.width);
        document.getElementById('hidden-height').value = String(derivatives.height);

        google.script.run
          .withSuccessHandler(function (r) { clearHiddenForm(); resolve(r); })
          .withFailureHandler(function (err) { clearHiddenForm(); reject(err); })
          .uploadGuestPhotoForm(document.getElementById('hidden-blob-form'));
      } else {
        readFileAsDataUrl(item.file).then(function (origDataUrl) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .uploadGuestPhotoBase64({
              sessionToken: sessionToken,
              originalFilename: item.file.name,
              mimeType: item.file.type,
              originalBase64: origDataUrl,
              thumbBase64: derivatives.thumbBase64,
              mediumBase64: derivatives.mediumBase64,
              width: derivatives.width,
              height: derivatives.height
            });
        }).catch(reject);
      }
    });
  }

  async function processUploadQueueSequential() {
    if (state.isUploading || !state.token) return;
    var workerGen = uploadSessionGen;
    var workerToken = state.token;
    state.isUploading = true;
    renderUploadQueue();

    var uploadedCount = 0;
    for (var i = 0; i < state.uploadQueue.length; i++) {
      if (workerGen !== uploadSessionGen) return;
      var item = state.uploadQueue[i];
      if (item.status !== 'pending') continue;

      try {
        item.status = 'processing';
        item.progress = 25;
        renderUploadQueue();

        var derivatives = await generateDerivatives(item.file);
        if (workerGen !== uploadSessionGen) return;

        item.status = 'uploading';
        item.progress = 60;
        renderUploadQueue();

        var res = await sendSinglePhoto(item, derivatives, workerToken);
        if (workerGen !== uploadSessionGen) return;
        if (!res || !res.ok) {
          if (handleServerAuthError(res && res.error)) {
            item.status = 'pending';
            item.progress = 0;
            state.isUploading = false;
            return;
          }
          throw new Error((res && res.error) || 'Server rejected upload.');
        }

        item.status = res.duplicate ? 'duplicate' : 'done';
        item.progress = 100;
        if (!res.duplicate) uploadedCount++;
        renderUploadQueue();
      } catch (err) {
        if (workerGen !== uploadSessionGen) return;
        item.status = 'error';
        item.progress = 0;
        item.error = err.message || 'Upload failed';
        renderUploadQueue();
      }
    }

    if (workerGen !== uploadSessionGen) return;
    state.isUploading = false;
    renderUploadQueue();

    if (uploadedCount > 0) {
      showToast(uploadedCount + (uploadedCount === 1 ? ' photograph' : ' photographs') + ' added to our Silver Jubilee album!');
      resetAndLoadGallery();
    }
  }

  startUploadBtn.addEventListener('click', processUploadQueueSequential);

      if (q.status === 'error') {

        q.error = '';
      }

    processUploadQueueSequential();
  });

  function createSuggestionCard(meta) {
    var card = document.createElement('article');

    var q = document.createElement('div');

    q.textContent = 'Are you in this photo?';

    var pct = Math.round((Number(meta.confidence) || 0) * 100);
    metaLine.textContent = 'Shared by ' + meta.guest_name + (pct > 0 ? (' · ' + pct + '% match') : '');

    var actions = document.createElement('div');
    actions.className = 'suggestion-actions';

    var yesBtn = document.createElement('button');
    yesBtn.type = 'button';
    yesBtn.className = 'btn btn-primary btn-sm';
    yesBtn.textContent = "Yes, that's me";

    var noBtn = document.createElement('button');
    noBtn.type = 'button';
    noBtn.className = 'btn btn-secondary btn-sm';
    noBtn.textContent = 'No, not me';

    yesBtn.addEventListener('click', function () {
      submitSuggestionReview(meta, 'CONFIRMED', yesBtn, noBtn);
    });
    noBtn.addEventListener('click', function () {
      submitSuggestionReview(meta, 'REJECTED', yesBtn, noBtn);
    });

    actions.appendChild(yesBtn);
    actions.appendChild(noBtn);
    body.appendChild(q);
    body.appendChild(metaLine);
    body.appendChild(actions);
    card.appendChild(media);
    card.appendChild(body);

    return { card: card, media: media, img: img };
  }

  function submitSuggestionReview(meta, decision, yesBtn, noBtn) {
    if (!state.token) return;
    yesBtn.disabled = true;
    noBtn.disabled = true;
    if (decision === 'CONFIRMED') {
      yesBtn.textContent = 'Saving...';
    } else {
      noBtn.textContent = 'Saving...';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          yesBtn.disabled = false;
          noBtn.disabled = false;
          yesBtn.textContent = "Yes, that's me";
          noBtn.textContent = 'No, not me';
          if (!handleServerAuthError(res && res.error)) {
            showToast((res && res.error) || 'Could not save your review.', true);
          }
          return;
        }

        var entry = state.suggestionMap[meta.photo_id];
        var savedThumb = entry ? entry.thumbUrl : null;
        if (entry && entry.cardEl && entry.cardEl.parentNode) {
          entry.cardEl.parentNode.removeChild(entry.cardEl);
        }
        delete state.suggestionMap[meta.photo_id];
        state.suggestions = state.suggestions.filter(function (s) { return s.photo_id !== meta.photo_id; });

        state.faceCounts.pendingCount = Math.max(0, (state.faceCounts.pendingCount || 0) - 1);
        if (decision === 'CONFIRMED') {
          state.faceCounts.confirmedCount = (state.faceCounts.confirmedCount || 0) + 1;
          showToast('Added to your My Photos album!');
          // Immediately append to My Photos grid if we are on My Photos tab
          if (state.activeTab === 'my') {
            myEmptyEl.classList.add('hidden');
            masonryEl.classList.remove('hidden');
            appendPhotoToMasonry(meta, savedThumb);
            if (!savedThumb) pumpThumbnailQueue();
            state.totalCount = (state.totalCount || 0) + 1;
            countLabel.textContent = state.totalCount + (state.totalCount === 1 ? ' Confirmed Photograph of You' : ' Confirmed Photographs of You');
          }
        } else {
          showToast('Suggestion dismissed.');
        }

        if (state.suggestions.length === 0 && !state.suggestionsHasMore) {
          suggestionsPanel.classList.add('hidden');
        } else {
          suggestionsHeading.textContent = 'Suggested for You (' + state.faceCounts.pendingCount + ' waiting)';
        }
        renderFaceProfileUI();
      })
      .withFailureHandler(function () {
        yesBtn.disabled = false;
        noBtn.disabled = false;
        yesBtn.textContent = "Yes, that's me";
        noBtn.textContent = 'No, not me';
        showToast('Network error saving review. Please try again.', true);
      })
      .reviewPhotoSuggestion(meta.photo_id, decision, state.token);
  }

  function loadNextSuggestionsPage() {
    if (state.isLoadingSuggestions || !state.token) return;
    state.isLoadingSuggestions = true;
    var gen = galleryGen;
    var nextPage = state.suggestionsPage + 1;
    loadMoreSuggestionsBtn.disabled = true;
    loadMoreSuggestionsBtn.textContent = 'Loading...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (gen !== galleryGen) return;
        state.isLoadingSuggestions = false;
        loadMoreSuggestionsBtn.disabled = false;
        loadMoreSuggestionsBtn.textContent = 'Load More Suggestions';

        if (!res || !res.ok) {
          handleServerAuthError(res && res.error);
          return;
        }

        state.suggestionsPage = res.page;
        state.suggestionsHasMore = res.hasMore;
        state.faceCounts.pendingCount = res.totalCount;
        renderFaceProfileUI();

        if (res.totalCount === 0) {
          suggestionsPanel.classList.add('hidden');
          return;
        }

        suggestionsPanel.classList.remove('hidden');
        suggestionsHeading.textContent = 'Suggested for You (' + res.totalCount + ' waiting)';

        (res.suggestions || []).forEach(function (meta) {
          if (state.suggestionMap[meta.photo_id]) return;
          var ui = createSuggestionCard(meta);
          var existingThumb = state.photoMap[meta.photo_id] ? state.photoMap[meta.photo_id].thumbUrl : null;
          state.suggestionMap[meta.photo_id] = {
            meta: meta,
            cardEl: ui.card,
            mediaEl: ui.media,
            imgEl: ui.img,
            thumbUrl: existingThumb,
            mediumUrl: null
          };
          state.suggestions.push(meta);
          suggestionsGrid.appendChild(ui.card);

          if (existingThumb) {
            ui.img.src = existingThumb;
            ui.media.classList.add('loaded');
          } else {
            state.thumbQueue.push(meta.photo_id);
          }
        });

        pumpThumbnailQueue();
        if (state.suggestionsHasMore) {
          suggestionsMoreWrap.classList.remove('hidden');
        } else {
          suggestionsMoreWrap.classList.add('hidden');
        }
      })
      .withFailureHandler(function () {
        if (gen !== galleryGen) return;
        state.isLoadingSuggestions = false;
        loadMoreSuggestionsBtn.disabled = false;
        loadMoreSuggestionsBtn.textContent = 'Load More Suggestions';
      })
      .getMyPhotoSuggestions(state.token, nextPage, 12);
  }

    var ready = !state.isSubmittingFace &&
      state.faceRefFiles.length >= 1 &&
      faceConsentCheckbox &&
      faceConsentCheckbox.checked;
    submitFaceBtn.disabled = !ready;
    submitFaceBtn.textContent = state.isSubmittingFace
      ? 'Submitting Privately...'
      : ('Submit ' + (state.faceRefFiles.length > 0 ? state.faceRefFiles.length + ' ' : '') + 'Reference Photo' + (state.faceRefFiles.length === 1 ? '' : 's'));
  }

  function openFaceModal() {
    clearFaceRefFiles();
    faceModal.classList.remove('hidden');
  }

  function closeFaceModal() {
    if (state.isSubmittingFace) {
      showToast('Please wait while your reference photos finish uploading.');
      return;
    }
    faceModal.classList.add('hidden');
    clearFaceRefFiles();
  }

  topbarFaceBtn.addEventListener('click', function () {
    if (state.faceProfile && state.faceProfile.status === 'ACTIVE') {
      switchTab('my');
    } else {
      openFaceModal();
    }
  });
  openFaceModalBtn.addEventListener('click', openFaceModal);
  myEmptyFaceBtn.addEventListener('click', openFaceModal);
  closeFaceModalBtn.addEventListener('click', closeFaceModal);
  cancelFaceModalBtn.addEventListener('click', closeFaceModal);
  faceConsentCheckbox.addEventListener('change', updateSubmitFaceButtonState);

  faceDropzone.addEventListener('click', function () { faceFilePicker.click(); });
  faceDropzone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      faceFilePicker.click();
    }
  });
  faceFilePicker.addEventListener('change', function () {
    if (faceFilePicker.files) addFaceRefFiles(faceFilePicker.files);
    faceFilePicker.value = '';
  });

  function addFaceRefFiles(fileList) {
    faceModalMsg.textContent = '';
    for (var i = 0; i < fileList.length; i++) {
      if (state.faceRefFiles.length >= 4) {
        showToast('Maximum 4 reference photos can be submitted at once.', false);
        break;
      }
      var f = fileList[i];
      if (ALLOWED_TYPES.indexOf(f.type) === -1) {
        showToast('Skipped "' + f.name + '": Please choose JPEG, PNG, or WebP.', true);
        continue;
      }
      if (f.size > MAX_FILE_BYTES) {
        showToast('Skipped "' + f.name + '": Exceeds 10 MB limit.', true);
        continue;
      }
      state.faceRefFiles.push({
        id: 'fref_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        file: f,
        previewUrl: URL.createObjectURL(f)
      });
    }
    renderFacePreviewStrip();
    updateSubmitFaceButtonState();
  }

  function renderFacePreviewStrip() {
    facePreviewStrip.innerHTML = '';
    state.faceRefFiles.forEach(function (item) {
      var wrap = document.createElement('div');
      wrap.className = 'face-preview-item';

      var img = document.createElement('img');
      img.src = item.previewUrl;
      img.alt = item.file.name;

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'face-preview-rm';
      rm.textContent = '×';
      rm.title = 'Remove photo';
      rm.addEventListener('click', function () {
        URL.revokeObjectURL(item.previewUrl);
        state.faceRefFiles = state.faceRefFiles.filter(function (x) { return x.id !== item.id; });
        renderFacePreviewStrip();
        updateSubmitFaceButtonState();
      });

      wrap.appendChild(img);
      wrap.appendChild(rm);
      facePreviewStrip.appendChild(wrap);
    });
  }

  function resizeFaceReferenceToJpeg(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var objUrl = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(objUrl);
        var natW = img.naturalWidth;
        var natH = img.naturalHeight;
        var scale = Math.min(1, 1200 / Math.max(natW, natH));
        var w = Math.max(1, Math.round(natW * scale));
        var h = Math.max(1, Math.round(natH * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({
          filename: file.name,
          mimeType: 'image/jpeg',
          base64: canvas.toDataURL('image/jpeg', 0.88)
        });
      };
      img.onerror = function () {
        URL.revokeObjectURL(objUrl);
        reject(new Error('Could not decode "' + file.name + '".'));
      };
      img.src = objUrl;
    });
  }

  submitFaceBtn.addEventListener('click', async function () {
    if (state.isSubmittingFace || !state.token) return;
    if (!faceConsentCheckbox.checked) {
      faceModalMsg.textContent = 'Please check the consent box first.';
      faceModalMsg.className = 'alert-msg error';
      return;
    }
    if (state.faceRefFiles.length === 0) return;

    state.isSubmittingFace = true;
    faceModalMsg.textContent = 'Preparing reference photos...';
    faceModalMsg.className = 'alert-msg';
    updateSubmitFaceButtonState();

    try {
      var encodedImages = [];
      for (var i = 0; i < state.faceRefFiles.length; i++) {
        encodedImages.push(await resizeFaceReferenceToJpeg(state.faceRefFiles[i].file));
      }

      faceModalMsg.textContent = 'Saving privately for local family face scan...';

      google.script.run
        .withSuccessHandler(function (res) {
          state.isSubmittingFace = false;
          if (!res || !res.ok) {
            updateSubmitFaceButtonState();
            if (!handleServerAuthError(res && res.error)) {
              faceModalMsg.textContent = (res && res.error) || 'Could not submit face profile.';
              faceModalMsg.className = 'alert-msg error';
            }
            return;
          }
          faceModal.classList.add('hidden');
          clearFaceRefFiles();
          showToast('Face photos saved! Suggestions will appear after the next family scan.');
          loadFaceProfileStatus();
          if (state.activeTab !== 'my') {
            switchTab('my');
          }
        })
        .withFailureHandler(function () {
          state.isSubmittingFace = false;
          updateSubmitFaceButtonState();
          faceModalMsg.textContent = 'Network error submitting reference photos. Please try again.';
          faceModalMsg.className = 'alert-msg error';
        })
        .registerFaceProfile({
          sessionToken: state.token,
          consentGranted: true,
          images: encodedImages
        });
    } catch (err) {
      state.isSubmittingFace = false;
      updateSubmitFaceButtonState();
      faceModalMsg.textContent = err.message || 'Could not process selected photo.';
      faceModalMsg.className = 'alert-msg error';
    }
  });

  withdrawFaceBtn.addEventListener('click', function () {
    if (!state.token) return;
    var ok = window.confirm(
      'Remove your face profile and clear your personal photo suggestions?\n\n' +
      'Your shared album photos remain untouched, and you can re-enable My Photos anytime.'
    );
    if (!ok) return;

    withdrawFaceBtn.disabled = true;
    withdrawFaceBtn.textContent = 'Removing...';

    google.script.run
      .withSuccessHandler(function (res) {
        withdrawFaceBtn.disabled = false;
        withdrawFaceBtn.textContent = 'Remove Face Data';
        if (!res || !res.ok) {
          if (!handleServerAuthError(res && res.error)) {
            showToast((res && res.error) || 'Could not remove face data.', true);
          }
          return;
        }
        showToast('Your face profile and suggestions have been removed.');
        resetAndLoadGallery();
      })
      .withFailureHandler(function () {
        withdrawFaceBtn.disabled = false;
        withdrawFaceBtn.textContent = 'Remove Face Data';
        showToast('Network error removing face data. Please try again.', true);
      })
      .withdrawFaceConsent(state.token);
  });
})();
</script>
